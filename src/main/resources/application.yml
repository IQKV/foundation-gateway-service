# ===================================================================
# Spring Boot configuration.
# Overridden by active profile (e.g. application-dev.yml).
# ===================================================================

server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: foundation-gateway-service
  output:
    ansi:
      enabled: always
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${IAM_JWKS_URI:http://localhost:8080/.well-known/jwks.json}
  cloud:
    gateway:
      # ---------------------------------------------------------------------------
      # Global CORS
      # ---------------------------------------------------------------------------
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "${CORS_ALLOWED_ORIGINS:*}"
            allowedMethods: ["GET", "POST", "PUT", "PATCH", "DELETE", "OPTIONS"]
            allowedHeaders: ["*"]
            allowCredentials: false
            maxAge: 3600
      # ---------------------------------------------------------------------------
      # Routes
      # ---------------------------------------------------------------------------
      routes:
        # IAM Service — JWKS (public, no auth)
        - id: iam-jwks
          uri: ${IAM_SERVICE_URI:http://localhost:8080}
          predicates:
            - Path=/.well-known/**

        # IAM Service — all API endpoints (/api/v1/iam/**)
        # Public vs protected distinction is enforced by SecurityConfig + GatewayProperties.
        # Header sanitization (X-User-*, X-Tenant-ID) is handled globally by HeaderSanitizationFilter.
        - id: iam-api
          uri: ${IAM_SERVICE_URI:http://localhost:8080}
          predicates:
            - Path=/api/v1/iam/**

        # Billing Service — Stripe webhook (public, secured by Stripe signature verification)
        - id: billing-webhooks
          uri: ${BILLING_SERVICE_URI:http://localhost:8081}
          predicates:
            - Path=/api/v1/billing/webhooks/**

        # Billing Service — all other API endpoints (/api/v1/billing/**)
        # Protected: requires valid JWT with TENANT_OWNER authority.
        # Header sanitization (X-Tenant-ID) is handled globally by HeaderSanitizationFilter.
        - id: billing-api
          uri: ${BILLING_SERVICE_URI:http://localhost:8081}
          predicates:
            - Path=/api/v1/billing/**

# ---------------------------------------------------------------------------
# Actuator
# ---------------------------------------------------------------------------
management:
  server:
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized

# ---------------------------------------------------------------------------
# SpringDoc / Swagger UI  (webflux variant)
# ---------------------------------------------------------------------------
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    # Aggregate specs from downstream services
    urls:
      - name: IAM Service
        url: ${IAM_SERVICE_URI:http://localhost:8080}/api-docs
      - name: Billing Service
        url: ${BILLING_SERVICE_URI:http://localhost:8081}/api-docs
      - name: Gateway
        url: /api-docs
  # Allow swagger-ui to reach downstream api-docs through the gateway
  webjars:
    prefix: ""

# ---------------------------------------------------------------------------
# Gateway-specific properties
# ---------------------------------------------------------------------------
iqkv:
  platform:
    # Platform-wide operational mode: MULTI_TENANT (default) or SINGLE_TENANT
    # MULTI_TENANT: Each user signup creates a new tenant with TENANT_OWNER authority
    # SINGLE_TENANT: All users join a single pre-provisioned default tenant with MEMBER authority
    # Must match the rollout-mode configured in foundation-iam-service and foundation-gateway-service
    rollout-mode: ${ROLLOUT_MODE:MULTI_TENANT}
  tenancy:
    # Default tenant key for SINGLE_TENANT mode — must match IAM service configuration
    # Format: 8-character NanoID using alphabet [a-z0-9]
    # Example: abc12345
    default-tenant-key: ${DEFAULT_TENANT_KEY:}
  iam:
    # IAM service base URL used by PlatformModeGuardFilter to verify canonical rollout mode
    # The gateway queries IAM's actuator/health endpoint to confirm mode consistency
    service-url: ${IAM_SERVICE_URL:http://foundation-iam-service:8080}
  gateway:
    public-paths:
      # IAM auth — temporarily fully public for UI development
      - /api/v1/iam/**
      - /.well-known/**
      - /actuator/**
      - /api-docs/**
      - /swagger-ui/**
      - /swagger-ui.html
      - /webjars/**
      # Billing — Stripe webhook is public (secured by Stripe signature verification)
      - /api/v1/billing/webhooks/**
git:
  build_time: "@git.build.time@"
  commit: "@git.commit.id.abbrev@"
info:
  app:
    build_time: ${git.build_time}
    description: "@project.description@"
    git_commit: ${git.commit}
    name: "@project.name@"
    version: "@project.version@"
