# ===================================================================
# Spring Boot configuration for the "dev" profile (K8s / dev cluster).
# Overrides base: points to in-cluster service names.
# ===================================================================

management:
  endpoints:
    web:
      exposure:
        include: "*"

logging:
  level:
    com.iqkv: DEBUG
    org.springframework.cloud.gateway: DEBUG
    org.springframework.security: DEBUG

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${IAM_JWKS_URI:http://foundation-iam-service:8080/.well-known/jwks.json}
