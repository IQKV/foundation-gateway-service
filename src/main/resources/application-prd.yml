# ===================================================================
# Spring Boot configuration for the "prd" profile.
# Overrides base: all secrets via env vars (no defaults), hardens
# actuator/swagger.
# ===================================================================

server:
  shutdown: graceful

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoint:
    health:
      show-details: never

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${IAM_JWKS_URI}
