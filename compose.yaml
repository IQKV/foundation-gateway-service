services:
  # PostgreSQL for IAM and Billing
  postgres-gateway:
    extends:
      file: compose.base.yaml
      service: postgres-gateway

  # RabbitMQ
  rabbitmq-gateway:
    extends:
      file: compose.base.yaml
      service: rabbitmq-gateway

  # MailHog for local email testing
  mailhog:
    extends:
      file: compose.base.yaml
      service: mailhog

  # IAM Service - pre-built image
  iam-service:
    extends:
      file: compose.base.yaml
      service: iam-service

  # Billing Service - pre-built image
  billing-service:
    extends:
      file: compose.base.yaml
      service: billing-service

  # SonarQube for code quality analysis
  sonar:
    extends:
      file: compose.base.yaml
      service: sonar

  # Prometheus for metrics collection
  prometheus:
    extends:
      file: compose.base.yaml
      service: prometheus

  # Grafana for metrics visualization
  grafana:
    extends:
      file: compose.base.yaml
      service: grafana

networks:
  gateway-service-network:
    name: foundation-gateway-network-dev
    external: false

volumes:
  postgres_gateway_data:
    name: iqkv_gateway_postgres_data_dev
  gateway_logs:
    name: iqkv_gateway_logs_dev
  gateway_tmp:
    name: iqkv_gateway_tmp_dev
