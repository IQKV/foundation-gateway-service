services:
  # PostgreSQL for IAM and Billing
  postgres-gateway:
    extends:
      file: compose.base.yaml
      service: postgres-gateway

  # RabbitMQ
  rabbitmq-gateway:
    extends:
      file: compose.base.yaml
      service: rabbitmq-gateway

  # MailHog for local email testing
  mailhog:
    extends:
      file: compose.base.yaml
      service: mailhog

  # IAM Service - pre-built image
  iam-service:
    extends:
      file: compose.base.yaml
      service: iam-service

  # Billing Service - pre-built image
  billing-service:
    extends:
      file: compose.base.yaml
      service: billing-service

  # Gateway Service - Full platform run including build phase
  gateway-service:
    extends:
      file: compose.base.yaml
      service: gateway-service
    environment:
      # Override upstream service URLs to use internal container names
      IAM_SERVICE_URI: http://iam-service:8080
      IAM_JWKS_URI: http://iam-service:8080/.well-known/jwks.json
      IQKV_IAM_SERVICE_URL: http://iam-service:8081
      BILLING_SERVICE_URI: http://billing-service:8080
    depends_on:
      iam-service:
        condition: service_healthy
      billing-service:
        condition: service_healthy

networks:
  gateway-service-network:
    name: foundation-gateway-network-dev
    external: false

volumes:
  postgres_gateway_data:
    name: iqkv_gateway_postgres_data_dev
  gateway_logs:
    name: iqkv_gateway_logs_dev
  gateway_tmp:
    name: iqkv_gateway_tmp_dev
